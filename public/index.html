<!DOCTYPE html>
<html lang="th" class="h-full antialiased">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ระบบ ROAD Next-Gen · R&D Research Studio & AI Co-Pilot</title>
  <meta name="description" content="ROAD Next-Gen (Report Outline Assistant for Development) ระบบออกแบบโครงร่างและเขียนรายงานการวิจัย 5 บท พร้อม AI Co-Pilot" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Sarabun:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"IBM Plex Sans Thai"', 'system-ui', 'sans-serif'],
            mono: ['"IBM Plex Mono"', 'monospace'],
            sarabun: ['"Sarabun"', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    :root {
      --neu-bg-1: #eff4ff;
      --neu-bg-2: #e3ecff;
      --neu-bg-3: #d7e3ff;
      --neu-surface: rgba(242, 246, 255, 0.88);
      --neu-surface-solid: #eef3ff;
      --neu-ink: #0d1838;
      --neu-muted: #5b6d96;
      --neu-border: rgba(255, 255, 255, 0.92);
      --neu-shadow-outer: 12px 14px 28px rgba(157, 178, 224, 0.42), -10px -10px 24px rgba(255, 255, 255, 0.95);
      --neu-shadow-sm: 6px 8px 18px rgba(157, 178, 224, 0.38), -6px -6px 16px rgba(255, 255, 255, 0.95);
      --neu-shadow-inset: inset 3px 3px 8px rgba(163, 182, 224, 0.38), inset -3px -3px 8px rgba(255, 255, 255, 0.95), 0 8px 20px rgba(163, 182, 224, 0.2);
    }

    html.dark {
      --neu-bg-1: #0b1329;
      --neu-bg-2: #0f1b38;
      --neu-bg-3: #132247;
      --neu-surface: rgba(20, 33, 66, 0.88);
      --neu-surface-solid: #152347;
      --neu-ink: #f0f5ff;
      --neu-muted: #93a8d6;
      --neu-border: rgba(255, 255, 255, 0.12);
      --neu-shadow-outer: 12px 14px 30px rgba(4, 9, 22, 0.65), -6px -6px 20px rgba(38, 62, 118, 0.25);
      --neu-shadow-sm: 6px 8px 18px rgba(4, 9, 22, 0.6), -4px -4px 14px rgba(38, 62, 118, 0.22);
      --neu-shadow-inset: inset 3px 3px 8px rgba(5, 10, 25, 0.65), inset -2px -2px 6px rgba(45, 72, 135, 0.25), 0 6px 16px rgba(4, 9, 22, 0.4);
    }

    body {
      font-family: "Plus Jakarta Sans", "IBM Plex Sans Thai", system-ui, -apple-system, sans-serif;
      background: linear-gradient(145deg, var(--neu-bg-1) 0%, var(--neu-bg-2) 52%, var(--neu-bg-3) 100%);
      background-attachment: fixed;
      color: var(--neu-ink);
      overflow-x: hidden;
    }

    /* 3D Neumorphic Surfaces & Cards */
    .neu-card {
      background: var(--neu-surface);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--neu-border);
      border-radius: 28px;
      box-shadow: var(--neu-shadow-outer);
    }

    .neu-card-sm {
      background: var(--neu-surface);
      backdrop-filter: blur(12px);
      border: 1.5px solid var(--neu-border);
      border-radius: 20px;
      box-shadow: var(--neu-shadow-sm);
    }

    /* 3D Recessed / Beveled Input Pill (Matches reference image) */
    .neu-input-pill {
      background: var(--neu-surface);
      border: 1.5px solid var(--neu-border);
      border-radius: 22px;
      box-shadow: var(--neu-shadow-inset);
      transition: all 0.2s ease;
    }
    .neu-input-pill:focus-within {
      border-color: rgba(45, 126, 255, 0.75);
      box-shadow: var(--neu-shadow-inset), 0 0 0 4px rgba(45, 126, 255, 0.14);
    }

    /* 3D Glossy Electric-Blue Primary Pill Button (Matches Login Button in image) */
    .neu-btn-primary {
      background: linear-gradient(135deg, #32b6ff 0%, #1b6eff 52%, #3a32ee 100%);
      color: #ffffff;
      border-radius: 9999px;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        0 14px 28px -6px rgba(27, 110, 255, 0.58),
        0 4px 10px rgba(27, 110, 255, 0.35),
        inset 0 2px 4px rgba(255, 255, 255, 0.65),
        inset 0 -3px 6px rgba(14, 32, 130, 0.35);
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .neu-btn-primary:hover {
      transform: translateY(-2px);
      box-shadow:
        0 18px 34px -6px rgba(27, 110, 255, 0.7),
        0 6px 14px rgba(27, 110, 255, 0.42),
        inset 0 2px 5px rgba(255, 255, 255, 0.75),
        inset 0 -3px 6px rgba(14, 32, 130, 0.35);
    }
    .neu-btn-primary:active {
      transform: translateY(0px) scale(0.99);
    }

    /* 3D Glossy Emerald Button for Best AI Action */
    .neu-btn-emerald {
      background: linear-gradient(135deg, #22e39a 0%, #0ea86b 55%, #087f5b 100%);
      color: #ffffff;
      border-radius: 9999px;
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      box-shadow:
        0 14px 28px -6px rgba(14, 168, 107, 0.5),
        inset 0 2px 4px rgba(255, 255, 255, 0.65),
        inset 0 -3px 6px rgba(5, 75, 50, 0.35);
      transition: all 0.22s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .neu-btn-emerald:hover {
      transform: translateY(-2px);
      box-shadow:
        0 18px 34px -6px rgba(14, 168, 107, 0.65),
        inset 0 2px 5px rgba(255, 255, 255, 0.75);
    }

    /* 3D Squircle Soft Button (Matches Social / Moon Toggle Buttons in image) */
    .neu-squircle {
      background: var(--neu-surface);
      border: 1.5px solid var(--neu-border);
      border-radius: 22px;
      box-shadow: var(--neu-shadow-sm);
      transition: all 0.2s ease;
    }
    .neu-squircle:hover {
      transform: translateY(-2px);
      border-color: rgba(45, 126, 255, 0.55);
    }

    /* 3D Center Logo Medallion */
    .neu-logo-medallion {
      width: 148px;
      height: 148px;
      border-radius: 44px;
      background: linear-gradient(145deg, #f7faff 0%, #e1ebff 100%);
      border: 2px solid rgba(255, 255, 255, 0.95);
      box-shadow:
        16px 20px 38px rgba(147, 171, 222, 0.52),
        -12px -12px 30px rgba(255, 255, 255, 0.98),
        inset 3px 3px 10px rgba(255, 255, 255, 0.9),
        inset -4px -4px 12px rgba(173, 193, 235, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    html.dark .neu-logo-medallion {
      background: linear-gradient(145deg, #1a2b56 0%, #101c3b 100%);
      border-color: rgba(255, 255, 255, 0.15);
      box-shadow:
        16px 20px 38px rgba(3, 7, 18, 0.75),
        -8px -8px 24px rgba(42, 68, 130, 0.28),
        inset 2px 2px 8px rgba(255, 255, 255, 0.12);
    }

    /* Decorative 3D Orbs in Background (Matches reference image) */
    .orb-top-left {
      position: fixed;
      top: -110px;
      left: -110px;
      width: 310px;
      height: 310px;
      border-radius: 9999px;
      background: linear-gradient(145deg, #f6f9ff 0%, #dce7ff 100%);
      border: 14px solid rgba(132, 169, 255, 0.35);
      box-shadow:
        20px 25px 50px rgba(135, 164, 228, 0.45),
        inset -8px -8px 20px rgba(110, 152, 255, 0.35),
        inset 8px 8px 20px rgba(255, 255, 255, 0.95);
      pointer-events: none;
      z-index: 0;
    }
    .orb-mid-right {
      position: fixed;
      top: 22%;
      right: -38px;
      width: 145px;
      height: 145px;
      border-radius: 9999px;
      background: radial-gradient(circle at 30% 30%, #ffffff 0%, #d4e3ff 58%, #9bbdff 100%);
      box-shadow:
        -12px 18px 36px rgba(136, 165, 228, 0.45),
        inset 4px 4px 12px rgba(255, 255, 255, 0.95);
      pointer-events: none;
      z-index: 0;
    }
    .orb-bottom-left {
      position: fixed;
      bottom: -95px;
      left: -65px;
      width: 220px;
      height: 220px;
      border-radius: 9999px;
      background: linear-gradient(135deg, #e4eeff 0%, #c4d7ff 100%);
      border: 10px solid rgba(255, 255, 255, 0.75);
      box-shadow: 12px -10px 34px rgba(145, 170, 225, 0.4);
      pointer-events: none;
      z-index: 0;
    }
    .orb-bottom-right {
      position: fixed;
      bottom: -110px;
      right: -80px;
      width: 280px;
      height: 280px;
      border-radius: 9999px;
      background: linear-gradient(145deg, #f3f7ff 0%, #d8e5ff 100%);
      border: 12px solid rgba(255, 255, 255, 0.85);
      box-shadow: -14px -12px 36px rgba(145, 170, 225, 0.42);
      pointer-events: none;
      z-index: 0;
    }
    html.dark .orb-top-left,
    html.dark .orb-mid-right,
    html.dark .orb-bottom-left,
    html.dark .orb-bottom-right {
      opacity: 0.18;
    }

    @media print {
      @page {
        size: A4;
        margin: 15mm;
      }
      body {
        background: #ffffff !important;
        color: #000000 !important;
        font-family: "Sarabun", "IBM Plex Sans Thai", sans-serif !important;
      }
      .print\:hidden,
      .orb-top-left,
      .orb-mid-right,
      .orb-bottom-left,
      .orb-bottom-right {
        display: none !important;
      }
      .print-area, .print-area * {
        visibility: visible !important;
        color: #000000 !important;
      }
    }
  </style>
</head>
<body class="min-h-full relative">
  <!-- Decorative 3D Soft Neumorphic Floating Orbs -->
  <div class="orb-top-left print:hidden"></div>
  <div class="orb-mid-right print:hidden"></div>
  <div class="orb-bottom-left print:hidden"></div>
  <div class="orb-bottom-right print:hidden"></div>

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed bottom-5 right-5 z-50 flex flex-col gap-2 max-w-md print:hidden"></div>

  <!-- Main Application Mount -->
  <div id="app-root" class="relative z-10"></div>

  <!-- Core Scripts -->
  <script src="./js/data.js"></script>
  <script src="./js/advisor.js"></script>
  <script src="./js/generator.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
